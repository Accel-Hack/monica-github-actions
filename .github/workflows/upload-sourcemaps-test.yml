name: upload-sourcemaps test

on:
  pull_request:
    paths: ["upload-sourcemaps/**"]
  push:
    branches: [main]
    paths: ["upload-sourcemaps/**"]

permissions:
  contents: read

defaults:
  run:
    working-directory: ./upload-sourcemaps

jobs:
  test:
    name: upload-sourcemaps
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - run: node --test
